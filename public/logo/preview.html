<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AlphaSeekers — Logo preview</title>
<style>
  body{margin:0;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;background:#FAFAF7;color:#1A2332}
  h1{font-weight:800;letter-spacing:-1px;margin:0 0 4px}
  p.muted{color:#5A6A7E;margin:0 0 32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;padding:48px;max-width:1240px;margin:0 auto}
  .tile{background:#FFFFFF;border-radius:20px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:16px;align-items:center}
  .tile.dark{background:#0A1118;color:#E8EEF2}
  .tile h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#5A6A7E;font-weight:700}
  .tile.dark h3{color:#8899A6}
  .tile img{display:block}
  .sizes{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;justify-content:center}
  header{padding:64px 48px 0;max-width:1240px;margin:0 auto}
  footer{padding:32px 48px;color:#94A3B8;font-size:13px;max-width:1240px;margin:0 auto}
</style>
</head>
<body>
<header>
  <h1>AlphaSeekers logo system</h1>
  <p class="muted">Open this file directly in a browser to see every variant at native size.</p>
</header>

<div class="grid">
  <div class="tile">
    <h3>Mark — light</h3>
    <img src="mark-light.svg" width="160" height="160" alt="">
    <div class="sizes">
      <img src="mark-light.svg" width="96" height="96" alt="">
      <img src="mark-light.svg" width="64" height="64" alt="">
      <img src="mark-light.svg" width="32" height="32" alt="">
    </div>
  </div>

  <div class="tile dark">
    <h3>Mark — dark</h3>
    <img src="mark-dark.svg" width="160" height="160" alt="">
    <div class="sizes">
      <img src="mark-dark.svg" width="96" height="96" alt="">
      <img src="mark-dark.svg" width="64" height="64" alt="">
      <img src="mark-dark.svg" width="32" height="32" alt="">
    </div>
  </div>

  <div class="tile" style="color:#0A1118">
    <h3>Mark — mono (currentColor)</h3>
    <img src="mark-mono.svg" width="160" height="160" alt="" style="color:inherit">
  </div>

  <div class="tile">
    <h3>Favicon @ 16/32/48</h3>
    <div class="sizes">
      <img src="favicon.svg" width="16" height="16" alt="">
      <img src="favicon.svg" width="32" height="32" alt="">
      <img src="favicon.svg" width="48" height="48" alt="">
      <img src="favicon.svg" width="64" height="64" alt="">
    </div>
  </div>

  <div class="tile" style="grid-column:span 2">
    <h3>Wordmark — light</h3>
    <img src="wordmark-light.svg" width="600" height="auto" style="max-width:100%" alt="">
  </div>

  <div class="tile dark" style="grid-column:span 2">
    <h3>Wordmark — dark</h3>
    <img src="wordmark-dark.svg" width="600" height="auto" style="max-width:100%" alt="">
  </div>

  <div class="tile dark" style="grid-column:span 2">
    <h3>Bilingual lockup (en + dari)</h3>
    <img src="wordmark-bilingual.svg" width="700" height="auto" style="max-width:100%" alt="">
  </div>
</div>

<footer>Read the full design system in <code>public/logo/LOGO.md</code>.</footer>
</body>
</html>
