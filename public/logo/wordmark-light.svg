<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-label="AlphaSeekers">
  <title>AlphaSeekers</title>
  <defs>
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="55%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
  </defs>

  <!-- Mark (rounded square with gradient + white A) -->
  <rect x="0" y="0" width="240" height="240" rx="48" fill="url(#wm-bg)"/>
  <circle cx="120" cy="48" r="9" fill="#FFFFFF"/>
  <circle cx="120" cy="48" r="16" fill="#FFFFFF" fill-opacity="0.18"/>
  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 60 192 L 120 76 L 180 192"/>
    <path d="M 86 142 L 154 142"/>
  </g>

  <!-- Wordmark: AlphaSeekers in extrabold sans -->
  <text x="288" y="146" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800" font-size="92" letter-spacing="-2" fill="#0A1118">Alpha<tspan fill="#00B85C">Seekers</tspan></text>

  <!-- Tagline -->
  <text x="290" y="186" font-family="'Inter', system-ui, sans-serif"
        font-weight="500" font-size="22" letter-spacing="0.5" fill="#5A6A7E">
    Free education for Afghan students
  </text>
</svg>
