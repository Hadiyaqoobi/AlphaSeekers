<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="AlphaSeekers">
  <title>AlphaSeekers</title>

  <!-- Single-color version for embroidery, stencils, low-res favicons.
       Inherits color via currentColor so wherever you embed this, the
       mark adopts the surrounding text colour. -->
  <g fill="currentColor">
    <circle cx="120" cy="48" r="11"/>
  </g>
  <g stroke="currentColor" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 60 192 L 120 76 L 180 192"/>
    <path d="M 86 142 L 154 142"/>
  </g>
</svg>
