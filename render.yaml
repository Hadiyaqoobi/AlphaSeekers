# Render blueprint for AlphaSeekers.
#
# SIZING NOTE (from production readiness audit):
#   The `free` plan CANNOT serve the target scale. Free web services sleep after
#   ~15 min of inactivity (cold starts of 30s+), cap RAM at 512MB, and have no
#   horizontal scaling — unacceptable for a live education platform with cron jobs,
#   AI/RAG workloads, and Neon connections. Minimum recommended floor is ~$70-90/mo:
#     - Render Standard web service (this file) — sized for steady traffic.
#     - Neon paid plan WITH the pooler endpoint (-pooler host) for DATABASE_URL.
#     - A transactional email provider (ESP) for reminders.
#     - Separate dev/prod databases (do NOT share one Neon DB across environments).
#   See docs/DEPLOYMENT_RUNBOOK.md for the full breakdown.

services:
  - type: web
    name: alphaseekers
    runtime: node
    region: oregon
    # Upgraded from `free` — see SIZING NOTE above. Free tier cannot serve the
    # target scale (cold starts, 512MB RAM cap, no scaling, sleeps when idle).
    plan: standard
    # Render gates rollouts and restarts unhealthy instances on this endpoint.
    healthCheckPath: /api/health
    # Run DB migrations on every deploy so schema changes ship atomically with code.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      # Force production runtime posture: disables demo auth, auto-seed, mock Meet
      # links, and DB→memory fallback. Without this the app can silently run in demo mode.
      - key: ALPHASEEKERS_MODE
        value: production
      # DATABASE_URL MUST be the Neon POOLED (-pooler) connection string, with
      # ?sslmode=require. Optionally append ?connection_limit=5 (or set
      # DATABASE_CONNECTION_LIMIT below). See src/lib/prisma.ts.
      - key: DATABASE_URL
        sync: false
      # Optional: per-instance Prisma connection cap appended to DATABASE_URL.
      - key: DATABASE_CONNECTION_LIMIT
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # AES-256-GCM master key for at-rest field encryption (base64, 32 bytes).
      # Generate: openssl rand -base64 32
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Shared secret Telegram sends back in the X-Telegram-Bot-Api-Secret-Token header.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Web Push (VAPID). Generate with `npx web-push generate-vapid-keys`.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # --- AI provider keys (see src/lib/ai/config.ts) ---
      # Primary LLM. Get from console.groq.com (free tier available).
      - key: GROQ_API_KEY
        sync: false
      # Fallback LLM (Google AI Studio / Gemma). Some deployments use
      # GOOGLE_GENERATIVE_AI_API_KEY / GEMINI_API_KEY instead — set whichever the
      # provider client expects; the app currently reads GEMMA_API_KEY.
      - key: GEMMA_API_KEY
        sync: false
      # Alias envs some AI SDKs read (Gemini). Declared for forward-compat; safe to leave unset.
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Embeddings (HuggingFace Inference API).
      - key: HF_API_TOKEN
        sync: false
      # --- Cloudflare R2 (object storage) — names aligned with the code (Bundle E) ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Public base URL for serving R2 assets (also used by next.config.mjs image/CSP allowlist).
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # --- Email / OAuth ---
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false

  # --- Scheduled jobs -------------------------------------------------------
  # Render cron jobs run a command on a schedule. These curl the app's cron
  # endpoints with the CRON_SECRET bearer token. Set APP_BASE_URL and CRON_SECRET
  # on EACH cron service to the same values as the web service (CRON_SECRET must
  # match). If your Render plan/region does not support the `cron` type in a
  # blueprint, create these as "Cron Job" services in the dashboard using the
  # exact schedules/commands below — see docs/DEPLOYMENT_RUNBOOK.md.

  # Job worker drain — the heart of the automation backbone. Every domain event
  # (enrollment, homework submission, moderation, employee provisioning, session
  # reminders) enqueues durable Jobs; this cron drains them by POSTing the worker
  # endpoint once a minute. Each invocation claims a batch (FOR UPDATE SKIP LOCKED)
  # and runs the registered handlers. See docs/adr/0006-postgres-job-queue.md.
  # NOTE: this per-minute cron drain is the single-service run mode. At higher
  # throughput, replace it with the dedicated Background Worker service defined in
  # the commented block at the bottom of this file (runWorker() polling loop).
  - type: cron
    name: alphaseekers-worker
    runtime: node
    region: oregon
    plan: starter
    schedule: "* * * * *" # every minute — drain due jobs
    buildCommand: ""
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/worker"
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Reminders/scheduler now only ENQUEUE jobs (they no longer deliver inline); the
  # worker cron above performs the actual sends. See ADR-0004 and ADR-0006.
  - type: cron
    name: alphaseekers-reminders
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/10 * * * *" # every 10 minutes
    buildCommand: ""
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/reminders"
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: alphaseekers-scheduler
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 * * * *" # hourly
    buildCommand: ""
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/scheduler"
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: alphaseekers-ai-prep
    runtime: node
    region: oregon
    plan: starter
    # Every 15 min: the ai-prep handler only prepares sessions starting in the next
    # 25-45 min window, so it must run frequently to catch each upcoming session
    # (a once-daily run almost never lands inside that window).
    schedule: "*/15 * * * *"
    buildCommand: ""
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/ai-prep"
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: alphaseekers-data-retention
    runtime: node
    region: oregon
    plan: starter
    schedule: "30 3 * * *" # nightly at 03:30 UTC
    buildCommand: ""
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/data-retention"
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: alphaseekers-neon-warm
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/5 * * * *" # every 5 minutes — keep Neon compute warm
    buildCommand: ""
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/neon-warm"
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Daily super-admin KPI digest. Computes platform KPIs (getSuperKpis) and
  # dispatches the digest once a day. Enqueue-only endpoint: the actual delivery
  # runs on the worker cron above.
  - type: cron
    name: alphaseekers-kpi-digest
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 6 * * *" # daily at 06:00 UTC
    buildCommand: ""
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/kpi-digest"
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # --- ALTERNATIVE (scale-up): dedicated always-on Background Worker -----------
  # The per-minute `alphaseekers-worker` cron above drains the queue in batches,
  # which is simple and cheap but adds up to ~60s of polling latency and caps
  # throughput at one batch per minute. When job volume outgrows that, REPLACE the
  # worker cron with a dedicated Render Background Worker running the long-lived
  # runWorker() loop (src/lib/jobs/worker.ts via scripts/worker.mjs). It polls
  # continuously, claims jobs the instant they are due (near-zero latency), keeps
  # draining while work exists, and reaps stalled jobs periodically. Because
  # claiming uses FOR UPDATE SKIP LOCKED, you can run several replicas safely and
  # they will never process the same job twice. Uncomment and remove the cron:
  #
  # - type: worker
  #   name: alphaseekers-jobs
  #   runtime: node
  #   region: oregon
  #   plan: starter
  #   buildCommand: npm install && npx prisma generate && npm run build
  #   startCommand: node scripts/worker.mjs
  #   envVars:
  #     # Shares the SAME env as the web service (DATABASE_URL must be the Neon
  #     # pooled string; ALPHASEEKERS_MODE=production; provider/notification keys).
  #     - key: NODE_VERSION
  #       value: "20.18.1"
  #     - key: ALPHASEEKERS_MODE
  #       value: production
  #     - key: DATABASE_URL
  #       sync: false
