# Render blueprint for AlphaSeekers.
#
# SIZING NOTE (from production readiness audit):
#   For the TARGET scale (50+ courses, 10k students) the recommended floor is a
#   Render Standard web service + the automation crons below + a Neon paid plan
#   with the pooler endpoint + a transactional email provider + SEPARATE dev/prod
#   databases. See docs/DEPLOYMENT_RUNBOOK.md for the full breakdown.
#
#   CURRENT ROLLOUT: web service on the `starter` plan with the full AUTOMATION
#   suite ENABLED, driven by the ONE cron at the bottom (consolidated from seven
#   to three on 2026-08-19 and to one on 2026-10-13; see the note above it).
#   Each cron is a separately-billed Render service. The cron is self-configuring
#   — CRON_SECRET is copied from the web service via `fromService` and
#   APP_BASE_URL points at the stable Render URL — so it works on deploy with no
#   manual env setup. Upgrade the web service to `standard` when steady traffic
#   warrants it.

services:
  - type: web
    name: alphaseekers
    runtime: node
    region: oregon
    # Cost-neutral for the initial rollout. Upgrade to `standard` for the target
    # scale (steady traffic, more RAM, no idle sleep) — see SIZING NOTE above.
    plan: starter
    # Render gates rollouts and restarts unhealthy instances on this endpoint,
    # and calls it every few seconds for as long as the service runs.
    #
    # It therefore must NOT touch the database: a probe that queries Neon every
    # few seconds stops the compute ever suspending, and that alone used ~180
    # compute-unit hours a month against a free allowance of 100. /api/health is
    # a pure liveness check. Use /api/health?deep=1 by hand (it runs `SELECT 1`)
    # to confirm the database is reachable after a deploy — never as this path.
    healthCheckPath: /api/health
    buildCommand: npm install && npx prisma generate && npm run build
    # Migrations run HERE, after the build and before this release takes traffic.
    # If the script exits non-zero Render aborts the deploy and keeps the current
    # version serving, so code can never reach users ahead of its schema.
    #
    # They were previously applied out-of-band by hand, which went wrong exactly
    # as you would expect: a migration was run over the POOLED url, failed, and
    # stranded its advisory lock so the retry timed out until the holding session
    # was killed manually. The script uses DIRECT_DATABASE_URL specifically to
    # avoid the pooler, and refuses to run at all if it is unset.
    preDeployCommand: ./scripts/predeploy-migrate.sh
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      # Force production runtime posture: disables demo auth, auto-seed, mock Meet
      # links, and DB→memory fallback. Without this the app can silently run in demo mode.
      - key: ALPHASEEKERS_MODE
        value: production
      # DATABASE_URL MUST be the Neon POOLED (-pooler) connection string, with
      # ?sslmode=require. Optionally append ?connection_limit=5 (or set
      # DATABASE_CONNECTION_LIMIT below). See src/lib/prisma.ts.
      - key: DATABASE_URL
        sync: false
      # Optional: per-instance Prisma connection cap appended to DATABASE_URL.
      - key: DATABASE_CONNECTION_LIMIT
        sync: false
      # Neon DIRECT (unpooled) string — the same as DATABASE_URL but WITHOUT
      # `-pooler` in the hostname. Used ONLY by preDeployCommand to run
      # migrations; the app itself never touches it. Migrations cannot hold their
      # advisory lock through PgBouncer, which is why this exists separately.
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # AES-256-GCM master key for at-rest field encryption (base64, 32 bytes).
      # Generate: openssl rand -base64 32
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Shared secret Telegram sends back in the X-Telegram-Bot-Api-Secret-Token header.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Web Push (VAPID). Generate with `npx web-push generate-vapid-keys`.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # --- AI provider keys (see src/lib/ai/config.ts) ---
      # Primary LLM. Get from console.groq.com (free tier available).
      - key: GROQ_API_KEY
        sync: false
      # Fallback LLM (Google AI Studio / Gemma). Some deployments use
      # GOOGLE_GENERATIVE_AI_API_KEY / GEMINI_API_KEY instead — set whichever the
      # provider client expects; the app currently reads GEMMA_API_KEY.
      - key: GEMMA_API_KEY
        sync: false
      # Alias envs some AI SDKs read (Gemini). Declared for forward-compat; safe to leave unset.
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Embeddings (HuggingFace Inference API).
      - key: HF_API_TOKEN
        sync: false
      # --- Cloudflare R2 (object storage) — names aligned with the code (Bundle E) ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Public base URL for serving R2 assets (also used by next.config.mjs image/CSP allowlist).
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # --- Email / OAuth ---
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false

# --- Scheduled jobs -----------------------------------------------------------
# ONE cron, on an HOURLY pulse. It is the only thing that wakes the database on
# a schedule.
#
# How it got here:
#   - Originally seven separate crons, one of them (`neon-warm`) every 5 minutes
#     purely to stop the database sleeping, and the worker every minute. The
#     database never auto-suspended and the Neon free tier ran out mid-month:
#     502s on every route.
#   - 2026-08-19: collapsed to three — an hourly pulse plus two daily jobs.
#   - 2026-10-13: the two daily jobs folded into the pulse (below), after the
#     paid Neon plan was cancelled and every wake started to count again.
#
# Neon bills the hours its compute is awake and suspends after five idle
# minutes, so each wake costs about six minutes whatever it does. An hourly
# pulse is ~24 wakes a day, roughly 18 of the 100 free compute-unit hours a
# month at 0.25 CU. A separate daily cron costs a wake of its own; running the
# same job inside the pulse costs nothing extra, and saves a billed Render
# service too.
#
# Order matters, because each step feeds the next: enqueue reminders, run the
# scheduler, prep AI sessions, run the once-a-day jobs if this is their hour,
# then drain the queue — so a digest enqueued at 06:00 is emailed by the same
# pulse instead of waiting an hour. The worker step also renews the public-page
# cache while the database is awake (src/lib/platform/public-cache.ts).
#
# The daily jobs are keyed on the UTC hour of the pulse:
#   03 — data retention / job prune   (was its own cron at 03:30)
#   06 — KPI digest, pending-approval nudge, class health  (was its own at 06:00)
# Both are safe to run twice: retention is a delete-older-than, and the digests
# carry a per-day dedupe key.
#
# Trade-offs, accepted deliberately:
#   - the first visitor after an idle spell waits 1-3s while Neon wakes;
#   - session reminders land 25-95 min before class rather than exactly 60;
#   - queued email (welcomes, announcements) can take up to an hour to send.
# Password resets and urgent-ticket alerts are UNAFFECTED — both send directly
# over SMTP rather than through the queue.
#
# MANUAL STEP: removing a service from this file does NOT delete it on Render.
# `alphaseekers-data-retention` and `alphaseekers-kpi-digest` must be deleted in
# the Render dashboard, or they keep running, keep being billed, and keep waking
# the database twice a day.

  - type: cron
    name: alphaseekers-pulse
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 * * * *" # hourly — the only scheduled database wake
    buildCommand: ""
    # Sequential and fail-soft: one step erroring must not stop the queue from
    # draining, so each call is allowed to fail without aborting the rest.
    startCommand: >-
      HOUR=$(date -u +%H);
      curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/reminders" || true;
      curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/scheduler" || true;
      curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/ai-prep" || true;
      if [ "$HOUR" = "03" ]; then curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/data-retention" || true; fi;
      if [ "$HOUR" = "06" ]; then curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/kpi-digest" || true; fi;
      curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/worker"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET
