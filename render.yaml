# Render blueprint for AlphaSeekers.
#
# SIZING NOTE (from production readiness audit):
#   For the TARGET scale (50+ courses, 10k students) the recommended floor is a
#   Render Standard web service + the automation crons below + a Neon paid plan
#   with the pooler endpoint + a transactional email provider + SEPARATE dev/prod
#   databases. See docs/DEPLOYMENT_RUNBOOK.md for the full breakdown.
#
#   CURRENT ROLLOUT: web service on the `starter` plan with the full AUTOMATION
#   suite ENABLED (the 7 crons at the bottom). Each cron is a separately-billed
#   Render service. The crons are self-configuring — CRON_SECRET is copied from the
#   web service via `fromService` and APP_BASE_URL points at the stable Render URL —
#   so they work on deploy with no manual env setup. Upgrade the web service to
#   `standard` when steady traffic warrants it.

services:
  - type: web
    name: alphaseekers
    runtime: node
    region: oregon
    # Cost-neutral for the initial rollout. Upgrade to `standard` for the target
    # scale (steady traffic, more RAM, no idle sleep) — see SIZING NOTE above.
    plan: starter
    # Render gates rollouts and restarts unhealthy instances on this endpoint.
    # /api/health is a cheap `SELECT 1` liveness probe (200 when the DB is reachable).
    healthCheckPath: /api/health
    # Migrations are applied OUT-OF-BAND against the Neon DIRECT (unpooled) endpoint,
    # because `prisma migrate deploy` cannot acquire its advisory lock over the pooled
    # (PgBouncer) DATABASE_URL. See docs/DEPLOYMENT_RUNBOOK.md for the migrate step.
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      # Force production runtime posture: disables demo auth, auto-seed, mock Meet
      # links, and DB→memory fallback. Without this the app can silently run in demo mode.
      - key: ALPHASEEKERS_MODE
        value: production
      # DATABASE_URL MUST be the Neon POOLED (-pooler) connection string, with
      # ?sslmode=require. Optionally append ?connection_limit=5 (or set
      # DATABASE_CONNECTION_LIMIT below). See src/lib/prisma.ts.
      - key: DATABASE_URL
        sync: false
      # Optional: per-instance Prisma connection cap appended to DATABASE_URL.
      - key: DATABASE_CONNECTION_LIMIT
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # AES-256-GCM master key for at-rest field encryption (base64, 32 bytes).
      # Generate: openssl rand -base64 32
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Shared secret Telegram sends back in the X-Telegram-Bot-Api-Secret-Token header.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Web Push (VAPID). Generate with `npx web-push generate-vapid-keys`.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # --- AI provider keys (see src/lib/ai/config.ts) ---
      # Primary LLM. Get from console.groq.com (free tier available).
      - key: GROQ_API_KEY
        sync: false
      # Fallback LLM (Google AI Studio / Gemma). Some deployments use
      # GOOGLE_GENERATIVE_AI_API_KEY / GEMINI_API_KEY instead — set whichever the
      # provider client expects; the app currently reads GEMMA_API_KEY.
      - key: GEMMA_API_KEY
        sync: false
      # Alias envs some AI SDKs read (Gemini). Declared for forward-compat; safe to leave unset.
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Embeddings (HuggingFace Inference API).
      - key: HF_API_TOKEN
        sync: false
      # --- Cloudflare R2 (object storage) — names aligned with the code (Bundle E) ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Public base URL for serving R2 assets (also used by next.config.mjs image/CSP allowlist).
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # --- Email / OAuth ---
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false

# --- Scheduled jobs (ENABLED) --------------------------------------------------
# Each cron curls a /api/cron/* endpoint with the CRON_SECRET bearer token. The
# secret is copied from the web service via `fromService` and APP_BASE_URL points
# at the stable Render URL, so every cron is self-configuring on deploy. Each cron
# is a separately-billed Render service. See ADR-0004/0006 + docs/DEPLOYMENT_RUNBOOK.md.

  - type: cron
    name: alphaseekers-worker
    runtime: node
    region: oregon
    plan: starter
    schedule: "* * * * *" # every minute — drain the durable job queue
    buildCommand: ""
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/worker"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET

  - type: cron
    name: alphaseekers-reminders
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/10 * * * *" # every 10 minutes — enqueue session reminders
    buildCommand: ""
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/reminders"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET

  - type: cron
    name: alphaseekers-scheduler
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 * * * *" # hourly — auto-schedule sessions from teacher availability
    buildCommand: ""
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/scheduler"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET

  - type: cron
    name: alphaseekers-ai-prep
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/15 * * * *" # every 15 min — prep sessions starting in the next 25-45 min
    buildCommand: ""
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/ai-prep"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET

  - type: cron
    name: alphaseekers-data-retention
    runtime: node
    region: oregon
    plan: starter
    schedule: "30 3 * * *" # nightly 03:30 UTC — data retention / job prune
    buildCommand: ""
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/data-retention"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET

  - type: cron
    name: alphaseekers-neon-warm
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/5 * * * *" # every 5 min — keep Neon compute warm
    buildCommand: ""
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/neon-warm"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET

  - type: cron
    name: alphaseekers-kpi-digest
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 6 * * *" # daily 06:00 UTC — super-admin KPI digest
    buildCommand: ""
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/kpi-digest"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET
