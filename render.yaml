# Render blueprint for AlphaSeekers.
#
# Topology: ONE always-on `starter` web instance plus ONE hourly cron
# (`alphaseekers-pulse`). The database is Neon on the FREE plan, which allows
# 100 compute-unit hours a month and bills by the hours the compute is awake,
# so the design goal is to wake it only when something is due
# (docs/adr/0007-let-the-database-sleep.md,
#  docs/adr/0008-only-wake-the-database-when-something-is-due.md).
#
# The cron is self-configuring — CRON_SECRET is copied from the web service via
# `fromService` and APP_BASE_URL points at the stable Render URL — so it works on
# deploy with no manual env setup.
#
# The web service must stay a SINGLE instance: the public-page cache, the tick
# agenda and the buffered story-view counts are all held in its memory.

services:
  - type: web
    name: alphaseekers
    runtime: node
    region: oregon
    # Always on (starter does not idle-sleep), which the in-memory agenda in
    # src/lib/platform/agenda.ts relies on. Keep ONE instance; see the header.
    plan: starter
    # Render gates rollouts and restarts unhealthy instances on this endpoint,
    # and calls it every few seconds for as long as the service runs.
    #
    # It therefore must NOT touch the database: a probe that queries Neon every
    # few seconds stops the compute ever suspending, and that alone used ~180
    # compute-unit hours a month against a free allowance of 100. /api/health is
    # a pure liveness check. Use /api/health?deep=1 by hand (it runs `SELECT 1`)
    # to confirm the database is reachable after a deploy — never as this path.
    healthCheckPath: /api/health
    buildCommand: npm install && npx prisma generate && npm run build
    # Migrations run HERE, after the build and before this release takes traffic.
    # If the script exits non-zero Render aborts the deploy and keeps the current
    # version serving, so code can never reach users ahead of its schema.
    #
    # They were previously applied out-of-band by hand, which went wrong exactly
    # as you would expect: a migration was run over the POOLED url, failed, and
    # stranded its advisory lock so the retry timed out until the holding session
    # was killed manually. The script uses DIRECT_DATABASE_URL specifically to
    # avoid the pooler, and refuses to run at all if it is unset.
    preDeployCommand: ./scripts/predeploy-migrate.sh
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      # Force production runtime posture: disables demo auth, auto-seed, mock Meet
      # links, and DB→memory fallback. Without this the app can silently run in demo mode.
      - key: ALPHASEEKERS_MODE
        value: production
      # DATABASE_URL MUST be the Neon POOLED (-pooler) connection string, with
      # ?sslmode=require. Optionally append &connection_limit=5 (or set
      # DATABASE_CONNECTION_LIMIT below); the process holds exactly one Prisma
      # client, so that is the cap for the whole service. See src/lib/prisma.ts.
      - key: DATABASE_URL
        sync: false
      # Optional: per-instance Prisma connection cap appended to DATABASE_URL.
      - key: DATABASE_CONNECTION_LIMIT
        sync: false
      # Neon DIRECT (unpooled) string — the same as DATABASE_URL but WITHOUT
      # `-pooler` in the hostname. Used ONLY by preDeployCommand to run
      # migrations; the app itself never touches it. Migrations cannot hold their
      # advisory lock through PgBouncer, which is why this exists separately.
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # AES-256-GCM master key for at-rest field encryption (base64, 32 bytes).
      # Generate: openssl rand -base64 32
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Shared secret Telegram sends back in the X-Telegram-Bot-Api-Secret-Token header.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Web Push (VAPID). Generate with `npx web-push generate-vapid-keys`.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # --- AI provider keys (see src/lib/ai/config.ts) ---
      # Primary LLM. Get from console.groq.com (free tier available).
      - key: GROQ_API_KEY
        sync: false
      # Fallback LLM (Google AI Studio / Gemma). Some deployments use
      # GOOGLE_GENERATIVE_AI_API_KEY / GEMINI_API_KEY instead — set whichever the
      # provider client expects; the app currently reads GEMMA_API_KEY.
      - key: GEMMA_API_KEY
        sync: false
      # Alias envs some AI SDKs read (Gemini). Declared for forward-compat; safe to leave unset.
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Embeddings (HuggingFace Inference API).
      - key: HF_API_TOKEN
        sync: false
      # --- Cloudflare R2 (object storage) — names aligned with the code (Bundle E) ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Public base URL for serving R2 assets (also used by next.config.mjs image/CSP allowlist).
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # --- Email / OAuth ---
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false

# --- Scheduled jobs -----------------------------------------------------------
# ONE cron, hourly, calling ONE endpoint: POST /api/cron/tick.
#
# How it got here:
#   - Originally seven separate crons, one of them (`neon-warm`) every 5 minutes
#     purely to stop the database sleeping, and the worker every minute. The
#     database never auto-suspended and the Neon free tier ran out mid-month:
#     502s on every route.
#   - 2026-08-19: collapsed to three — an hourly pulse plus two daily jobs.
#   - 2026-10-13: the two daily jobs folded into the pulse (ADR-0007).
#   - 2026-10-14: the pulse stopped calling six endpoints that each queried the
#     database. It calls the gated tick, which decides FROM MEMORY whether
#     anything is due and returns `{"skipped":true}` without a single query when
#     nothing is (ADR-0008).
#
# Neon suspends after five idle minutes and bills the time awake, so each wake
# costs about 5-6 minutes whatever it does. Waking every hour was ~730 wakes and
# ~61-73 awake hours a month, most of them in hours with nothing to send.
#
# The tick runs the full work only when:
#   - the web process restarted and has not loaded its agenda yet;
#   - a session starts within 95 minutes (reminders + AI prep);
#   - a queued job is due (worker drain);
#   - it is 02 UTC (06:30 Kabul) or later and the daily work has not run today:
#     scheduler, data retention, the digests, public-page cache refresh.
# See src/lib/platform/cron-tick.ts for the order of the steps.
#
# Trade-offs, accepted deliberately:
#   - the first visitor after an idle spell waits 1-3s while Neon wakes;
#   - session reminders land 25-95 min before class rather than exactly 60;
#   - queued email (welcomes, announcements) is drained in-process right away,
#     and otherwise by the next tick that runs.
# Password resets and urgent-ticket alerts are UNAFFECTED — both send directly
# over SMTP rather than through the queue.
#
# MANUAL STEP: removing a service from this file does NOT delete it on Render.
# Any cron service other than `alphaseekers-pulse` (e.g.
# `alphaseekers-data-retention`, `alphaseekers-kpi-digest`, `neon-warm`) must be
# deleted in the Render dashboard, or it keeps running, keeps being billed, and
# keeps waking the database.

  - type: cron
    name: alphaseekers-pulse
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 * * * *" # hourly; most ticks answer from memory and wake nothing
    buildCommand: ""
    # One call. The individual /api/cron/* routes still exist for manual runs
    # (all POST, all CRON_SECRET or a super-admin session). --max-time only
    # bounds how long this billed cron job waits; the server finishes the tick.
    startCommand: >-
      curl -fsS --max-time 900 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/tick"
    envVars:
      - key: APP_BASE_URL
        value: https://alphaseekers.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: alphaseekers
          envVarKey: CRON_SECRET
